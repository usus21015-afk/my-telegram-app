<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            text-align: center;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }
        h2 { font-size: 24px; font-weight: 600; margin: 20px 0 10px; }
        p { font-size: 14px; color: var(--hint); margin-bottom: 20px; }
        .vote-option {
            border: 2px solid var(--hint);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .vote-option.selected {
            border-color: var(--btn);
            background: rgba(51, 144, 236, 0.1);
        }
        .main-btn {
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            max-width: 300px;
            margin: 20px auto 0;
            cursor: pointer;
            display: block;
        }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>Сделайте выбор</h2>
    <p>Выберите один из вариантов</p>
    <div class="vote-option" onclick="selectVote(this, 'Вариант 1')">Вариант 1</div>
    <div class="vote-option" onclick="selectVote(this, 'Вариант 2')">Вариант 2</div>
    <div class="vote-option" onclick="selectVote(this, 'Вариант 3')">Вариант 3</div>
    <button class="main-btn" id="btn-next" disabled onclick="submitVote()">Далее</button>

    <script>
        let selectedVote = null;

        function selectVote(el, choice) {
            document.querySelectorAll('.vote-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedVote = choice;
            document.getElementById('btn-next').disabled = false;
        }

        function submitVote() {
            if (!selectedVote) return;
            const tg = window.Telegram.WebApp;
            tg.sendData(JSON.stringify({
                type: "vote",
                vote: selectedVote
            }));
        }

        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
            }
        };
    </script>
</body>
</html>
